name: Windows build

# Every push to main builds the Windows installers and publishes them as a
# GitHub release named v0.1.<build number>. The app's "Update now" button
# installs the newest release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Stamp the version
        shell: pwsh
        run: |
          $version = "0.1.${{ github.run_number }}"
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json
          (Get-Content src-tauri/Cargo.toml) -replace '^version = ".*"', "version = `"$version`"" | Set-Content src-tauri/Cargo.toml
          "VERSION=$version" >> $env:GITHUB_ENV
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ env.VERSION }}
          releaseName: Noodle v${{ env.VERSION }}
          releaseBody: Built from ${{ github.sha }}. Install the .exe, or click "Update now" inside Noodle.
          releaseDraft: false
          prerelease: false
          args: --bundles msi,nsis
      - uses: actions/upload-artifact@v4
        with:
          name: noodle-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  # The phone app: a debug-signed APK attached to the same release, so it can
  # be installed straight from the release page.
  android:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # GitHub's Ubuntu runners already have the Android SDK and NDK.
      - name: Point the build at the Android NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Stamp the version
        run: |
          VERSION="0.1.${{ github.run_number }}"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > conf.tmp && mv conf.tmp src-tauri/tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - run: pnpm install --frozen-lockfile
      # Phones only accept an update signed with the same key as the installed
      # app. The key is kept between builds (in the ANDROID_KEYSTORE secret if
      # there is one, otherwise in the build cache) instead of a fresh one each time.
      - name: Restore the signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-signing-key-v1
      - name: Use the saved signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > ~/.android/debug.keystore
          elif [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Noodle,O=Noodle"
          fi
      - name: Build the APK
        run: |
          pnpm tauri android init --ci
          # Put the Noodle bowl on the home screen instead of the default icon.
          pnpm tauri icon src-tauri/icons/icon.png
          pnpm tauri android build --apk --target aarch64 --debug --ci
      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find src-tauri/gen/android -name "*.apk" | head -n 1)
          cp "$APK" "Noodle_${VERSION}_android.apk"
          gh release upload "v$VERSION" "Noodle_${VERSION}_android.apk" --clobber
