name: Windows build

# Every push to main builds the Windows installers and publishes them as a
# GitHub release named v0.1.<build number>. The app's "Update now" button
# installs the newest release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Stamp the version
        shell: pwsh
        run: |
          $version = "0.1.${{ github.run_number }}"
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json
          (Get-Content src-tauri/Cargo.toml) -replace '^version = ".*"', "version = `"$version`"" | Set-Content src-tauri/Cargo.toml
          "VERSION=$version" >> $env:GITHUB_ENV
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ env.VERSION }}
          releaseName: Noodle v${{ env.VERSION }}
          releaseBody: Built from ${{ github.sha }}. Install the .exe, or click "Update now" inside Noodle.
          releaseDraft: false
          prerelease: false
          args: --bundles msi,nsis
      - uses: actions/upload-artifact@v4
        with:
          name: noodle-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  # The phone app: a debug-signed APK attached to the same release, so it can
  # be installed straight from the release page.
  android:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install the Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Stamp the version
        run: |
          VERSION="0.1.${{ github.run_number }}"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > conf.tmp && mv conf.tmp src-tauri/tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - run: pnpm install --frozen-lockfile
      - name: Build the APK
        run: |
          pnpm tauri android init --ci
          pnpm tauri android build --apk --target aarch64 --debug --ci
      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find src-tauri/gen/android -name "*.apk" | head -n 1)
          cp "$APK" "Noodle_${VERSION}_android.apk"
          gh release upload "v$VERSION" "Noodle_${VERSION}_android.apk" --clobber
