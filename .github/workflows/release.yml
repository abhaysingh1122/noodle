name: Windows build

# Every push to main builds the Windows installers and publishes them as a
# GitHub release named v0.1.<build number>. The app's "Update now" button
# installs the newest release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Stamp the version
        shell: pwsh
        run: |
          $version = "0.1.${{ github.run_number }}"
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json
          (Get-Content src-tauri/Cargo.toml) -replace '^version = ".*"', "version = `"$version`"" | Set-Content src-tauri/Cargo.toml
          "VERSION=$version" >> $env:GITHUB_ENV
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ env.VERSION }}
          releaseName: Noodle v${{ env.VERSION }}
          releaseBody: Built from ${{ github.sha }}. Install the .exe, or click "Update now" inside Noodle.
          releaseDraft: false
          prerelease: false
          args: --bundles msi,nsis
      - uses: actions/upload-artifact@v4
        with:
          name: noodle-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
