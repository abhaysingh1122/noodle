[package]
name = "noodle"
version = "0.1.0"
description = "A local-first Markdown notes app where every note is connected"
license = "MIT"
edition = "2021"

[lib]
name = "noodle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-apk-install = { path = "plugins/apk-install" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
notify = "8"
regex = "1"
ureq = { version = "3", features = ["json"] }
tiny_http = "0.12"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
